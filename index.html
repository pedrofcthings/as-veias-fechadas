<!DOCTYPE html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>As Veias Fechadas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sorts+Mill+Goudy:ital@0;1&family=Vollkorn:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E5E3DB; --panel:#F1EFE9; --ink:#1A2430; --muted:#6E7480;
  --rule:#C3C0B5; --hair:#D5D2C8;
  --lib:#9C7B18; --lib-soft:#F0E7CE;
  --sud:#8E332A; --sud-soft:#F1DFDA;
  --turf:#CBD2BE;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper); color:var(--ink);
  font-family:Vollkorn,Georgia,serif; font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:"Sorts Mill Goudy",Georgia,serif; font-weight:400}
.wrap{max-width:1120px; margin:0 auto; padding:30px 24px 80px}
header{border-bottom:2px solid var(--ink); padding-bottom:13px}
h1{font-size:33px; margin:0 0 2px}
.sub{color:var(--muted); font-size:15px; font-style:italic; margin:0}

.controls{display:flex; gap:15px; align-items:flex-end; flex-wrap:wrap;
  padding:13px 0 14px; border-bottom:1px solid var(--rule)}
label{display:block; font-size:13px; color:var(--muted); margin-bottom:3px}
input[type=number]{font-family:Vollkorn,serif; font-size:17px; width:104px; padding:5px 8px;
  border:1px solid var(--rule); background:var(--panel); color:var(--ink); border-radius:0;
  font-variant-numeric:tabular-nums}
input:focus-visible,button:focus-visible{outline:2px solid var(--ink); outline-offset:2px}
.betbar:empty{display:none}
.betbar{margin:14px 0 0; padding:12px 15px; border:1px solid var(--rule); background:var(--panel);
  display:flex; align-items:center; gap:10px 14px; flex-wrap:wrap; font-size:15px}
.betbar .ask{font-family:"Sorts Mill Goudy",serif; font-size:17px}
.betbar select{font-size:15px; padding:4px 7px; max-width:210px; display:block}
.betbar label.bl{display:flex; flex-direction:column; gap:2px}
.betbar label.bl span{font-size:12px; color:var(--muted)}
.betbar button{font-size:14px; padding:5px 13px}
.betbar .st{font-size:14px; color:var(--muted); font-style:italic}
.betbar .ok{color:var(--lib); font-style:normal; font-weight:700}
.betbar .ko{color:var(--sud); font-style:normal}
.cl-link{cursor:pointer; border-bottom:1px dotted var(--rule)}
.cl-link:hover{border-bottom-color:var(--ink)}
.star{color:var(--lib); font-weight:700; margin-right:3px}
.sp .star{color:var(--sud)}
.pathbox{margin:10px 0 0; font-size:14.5px}
.pathbox .r{display:grid; grid-template-columns:120px 1fr auto; gap:10px;
  border-bottom:1px solid var(--hair); padding:3px 0}
.pathbox .r b{font-weight:400; color:var(--muted); font-size:13px}
.pathbox .sc{font-variant-numeric:tabular-nums; font-weight:700}
.pathbox .rg{font-size:12.5px; color:var(--muted); font-style:italic;
  padding:2px 0 4px 130px; border-bottom:1px solid var(--hair)}
.dompos{font-size:13.5px; color:var(--muted); font-style:italic; margin:4px 0 0}
.actionbar{display:flex; align-items:center; gap:16px; margin:16px 0 4px; flex-wrap:wrap}
#next{font-size:19px; padding:12px 30px; box-shadow:3px 3px 0 var(--rule); letter-spacing:.2px}
#next:not(:disabled):hover{transform:translate(1px,1px); box-shadow:2px 2px 0 var(--rule)}
.progline{font-size:13.5px; color:var(--muted); font-style:italic}
button{font-family:Vollkorn,serif; font-size:16px; padding:7px 17px; cursor:pointer;
  border:1px solid var(--ink); background:var(--ink); color:var(--panel); border-radius:0}
button.ghost{background:transparent; color:var(--ink)}
button:disabled{opacity:.35; cursor:default}
.check{display:flex; align-items:center; gap:6px; font-size:14px; color:var(--muted);
  padding-bottom:6px; cursor:pointer}
.check input{accent-color:var(--ink); width:15px; height:15px}
.toggles{display:flex; gap:14px; flex-wrap:wrap; padding-bottom:5px}
.check input:disabled+span{opacity:.45}
#dump[hidden]{display:none}
select{font-family:Vollkorn,serif; font-size:16px; padding:5px 7px; border:1px solid var(--rule);
  background:var(--panel); color:var(--ink); border-radius:0}
.ltab{max-width:520px}
.ltab td.pos{width:30px; color:var(--muted)}

/* progress strip */
.prog{display:flex; gap:0; flex-wrap:wrap; margin:12px 0 0; padding:0; list-style:none;
  border-top:1px solid var(--hair)}
.prog li{font-size:12.5px; color:var(--muted); padding:5px 11px 5px 0; display:flex; gap:5px}
.prog li b{font-weight:400; font-variant-numeric:tabular-nums; opacity:.55}
.prog li.done{color:var(--ink)}
.prog li.now{color:var(--ink); font-weight:600}

/* tabs */
.tabs{display:flex; gap:0; margin:20px 0 0; border-bottom:2px solid var(--ink)}
.tabs button{background:transparent; color:var(--muted); border:none; border-bottom:2px solid transparent;
  margin-bottom:-2px; font-size:19px; font-family:"Sorts Mill Goudy",serif; padding:5px 20px 6px}
.tabs button[aria-selected=true]{color:var(--ink); border-bottom-color:var(--ink)}
.tabs button.lib[aria-selected=true]{color:var(--lib); border-bottom-color:var(--lib)}
.tabs button.sud[aria-selected=true]{color:var(--sud); border-bottom-color:var(--sud)}
.subtabs{display:flex; flex-wrap:wrap; gap:0 4px; padding:11px 0 4px; border-bottom:1px solid var(--hair);
  margin-bottom:20px}
.subtabs button{background:transparent; border:1px solid transparent; color:var(--muted);
  font-size:14px; padding:3px 10px}
.subtabs button[aria-selected=true]{border-color:var(--rule); background:var(--panel); color:var(--ink)}
.pane{display:none} .pane.on{display:block}

.block{margin:0 0 26px}
.block h3{font-size:18px; margin:0 0 8px; border-bottom:1px solid var(--rule); padding-bottom:3px}
.tie{border-bottom:1px solid var(--hair); padding:6px 0}
.leg{display:grid; grid-template-columns:1fr 52px 1fr; gap:9px; align-items:baseline; font-size:15.5px}
.leg .h{text-align:right}
.leg .sc{text-align:center; font-variant-numeric:tabular-nums; color:var(--muted); font-size:14px}
.gl{display:grid; grid-template-columns:1fr 52px 1fr; gap:9px; font-size:12.5px;
  color:var(--muted); font-style:italic; line-height:1.35; margin:1px 0 3px}
.gl .h{text-align:right}
.agg{display:grid; grid-template-columns:1fr 52px 1fr; gap:9px; align-items:baseline;
  font-size:16px; margin-top:2px}
.agg .h{text-align:right}
.agg .sc{text-align:center; font-variant-numeric:tabular-nums; font-weight:700}
.win{font-weight:700}
.lp .win{color:var(--lib)} .sp .win{color:var(--sud)}
.out{color:var(--muted)}
.note{font-size:13px; color:var(--muted); font-style:italic; margin:4px 0 0}
table{width:100%; border-collapse:collapse; font-size:14.5px}
th{text-align:left; font-weight:600; font-size:13px; color:var(--muted);
  border-bottom:1px solid var(--rule); padding:3px 4px}
td{padding:3px 4px; border-bottom:1px solid var(--hair); font-variant-numeric:tabular-nums}
td.club{font-variant-numeric:normal}
th.num,td.num{text-align:right; width:36px}
tr.qual td{font-weight:600}
.lp tr.qual td.club{color:var(--lib)} .sp tr.qual td.club{color:var(--sud)}
.groups{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px 26px}
.groups h4{margin:0 0 3px; font-size:15px}
.champ{margin-top:8px; padding:16px 18px; border:2px solid}
.lp .champ{border-color:var(--lib); background:var(--lib-soft)}
.sp .champ{border-color:var(--sud); background:var(--sud-soft)}
.champ .lbl{font-size:13px; color:var(--muted); margin:0}
.king{margin:0 0 20px; padding:13px 16px; border:1px solid var(--rule); background:var(--panel);
  display:flex; align-items:baseline; gap:12px; flex-wrap:wrap}
.king .ttl{font-family:"Sorts Mill Goudy",serif; font-size:20px}
.lp .king{border-left:4px solid var(--lib)} .sp .king{border-left:4px solid var(--sud)}
.king .who{font-size:19px; font-weight:700}
.king .meta{font-size:13.5px; color:var(--muted); font-style:italic}
.champ .who{font-family:"Sorts Mill Goudy",serif; font-size:30px; margin:1px 0 0}
.fl{width:15px; height:10px; vertical-align:-1px; margin:0 5px; border:.5px solid rgba(0,0,0,.25)}
.empty{color:var(--muted); font-style:italic; font-size:15px}

/* squads */
.natrow{display:flex; flex-wrap:wrap; gap:0 4px; padding-bottom:12px; margin-bottom:18px;
  border-bottom:1px solid var(--hair)}
.natrow button{background:transparent; border:1px solid transparent; color:var(--muted);
  font-size:14px; padding:3px 9px; display:flex; align-items:center}
.natrow button[aria-selected=true]{border-color:var(--rule); background:var(--panel); color:var(--ink)}
.sqgrid{display:grid; grid-template-columns:212px 1fr; gap:28px; align-items:start}
@media(max-width:760px){.sqgrid{grid-template-columns:1fr}}
ul.clublist{list-style:none; margin:0; padding:0}
ul.clublist li{display:grid; grid-template-columns:1fr auto; gap:8px; font-size:15px;
  border-bottom:1px solid var(--hair); padding:4px 3px; cursor:pointer}
ul.clublist li:hover{background:var(--panel)}
ul.clublist li[aria-selected=true]{background:var(--panel); font-weight:600;
  box-shadow:inset 2px 0 0 var(--ink)}
ul.clublist li b{font-weight:400; font-variant-numeric:tabular-nums; color:var(--muted)}
.pitchwrap h3{font-size:20px; margin:0 0 2px}
.pitchwrap .m{font-size:13.5px; color:var(--muted); margin:0 0 10px; font-style:italic}
svg.pitch{width:100%; max-width:460px; height:auto; display:block; overflow:visible}
svg.pitch .turf{fill:var(--turf)}
svg.pitch .ln{fill:none; stroke:#FFF; stroke-width:.5; opacity:.85}
svg.chip{width:13px;height:13px;vertical-align:-2px;margin-right:6px}
ul.clublist li span{display:flex;align-items:center}
.pitchwrap h3 svg.chip{width:15px;height:15px;vertical-align:-2px}
svg.pitch text{font-family:Vollkorn,serif; fill:var(--ink)}
svg.pitch text.nm{font-size:4.1px; text-anchor:middle}
svg.pitch text.po{font-size:3.2px; text-anchor:middle; fill:var(--muted)}
svg.pitch text.cl{font-size:2.7px; text-anchor:middle; fill:var(--muted); font-style:italic}
.xiwrap{max-width:460px}
footer{margin-top:44px; padding-top:12px; border-top:1px solid var(--rule);
  font-size:13px; color:var(--muted)}

/* ---------- mobile ---------- */
@media(max-width:640px){
  .wrap{padding:18px 13px 90px}
  h1{font-size:25px} .sub{font-size:13.5px}
  .controls{gap:10px 12px; padding:11px 0 12px}
  .controls>div{flex:1 1 128px}
  input[type=number],select{width:100%; font-size:16px}
  .controls button.ghost{flex:1 1 auto; font-size:14px; padding:6px 10px}
  .actionbar{position:sticky; bottom:0; z-index:5; margin:12px -13px 0; padding:10px 13px;
    background:var(--paper); border-top:1px solid var(--rule); gap:8px}
  #next{width:100%; font-size:17px; padding:13px 12px; box-shadow:none}
  .progline{width:100%; text-align:center; font-size:12.5px}
  .prog{display:none}
  .tabs{overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{font-size:16px; padding:5px 13px 6px; white-space:nowrap}
  .subtabs,.natrow{overflow-x:auto; flex-wrap:nowrap; scrollbar-width:none; padding-bottom:8px}
  .subtabs::-webkit-scrollbar,.natrow::-webkit-scrollbar{display:none}
  .subtabs button,.natrow button{white-space:nowrap; flex:0 0 auto}
  .block h3{font-size:16px}
  .leg{grid-template-columns:1fr 44px 1fr; gap:5px; font-size:13.5px}
  .agg{grid-template-columns:1fr 44px 1fr; gap:5px; font-size:14px}
  .gl{grid-template-columns:1fr 44px 1fr; gap:5px; font-size:11px}
  .fl{width:13px; height:9px; margin:0 3px}
  table{font-size:13px} th{font-size:12px}
  .groups{grid-template-columns:1fr; gap:16px}
  .sqgrid{grid-template-columns:1fr; gap:14px}
  ul.clublist{max-height:190px; overflow-y:auto; border:1px solid var(--hair)}
  ul.clublist li{font-size:14px; padding:6px 8px}
  svg.pitch,.xiwrap{max-width:100%}
  .king{gap:6px 10px; padding:11px 13px} .king .ttl{font-size:17px} .king .who{font-size:16px}
  .champ .who{font-size:24px}
  .betbar{font-size:14px; padding:10px 12px; gap:8px 10px}
  .betbar .ask{font-size:15px; width:100%}
  .betbar select{max-width:none; flex:1 1 100%; font-size:16px}
  .betbar button{flex:1 1 auto}
  .toggles{width:100%; gap:16px}
  .pathbox .r{grid-template-columns:84px 1fr auto; gap:7px; font-size:13px}
  .pathbox .rg{padding-left:91px; font-size:11.5px}
  .ltab{max-width:100%}
  footer{font-size:12px}
}
@media(max-width:640px) and (display-mode:browser){ body{-webkit-text-size-adjust:100%} }
@media(prefers-reduced-motion:no-preference){
  .pane.on .block{animation:rise .26s ease-out}
  @keyframes rise{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>

<div class="wrap">
<header>
  <h1 id="h-title"></h1>
  <p class="sub" id="h-sub"></p>
</header>

<div class="controls">
  <div><label for="seed" id="lb-seed">Seed</label><input type="number" id="seed" value="1960"></div>
  <button id="next">Sortear os elencos</button>
  <button id="all" class="ghost"></button>
  <span class="toggles">
    <label class="check"><input type="checkbox" id="slow"> <span id="lb-slow"></span></label>
    <label class="check"><input type="checkbox" id="beton"> <span id="lb-beton"></span></label>
  </span>
  <button id="reset" class="ghost"></button>
  <button id="dump" class="ghost"></button>
  <div><label for="mode" id="lb-mode">Formato</label>
    <select id="mode"><option value="modern"></option><option value="old"></option></select></div>
  <div><label for="lang" id="lb-lang">Idioma</label>
    <select id="lang"><option value="pt">Português</option><option value="es">Español</option></select></div>
</div>
<div class="actionbar"><button id="next"></button><span class="progline" id="progline"></span></div>
<ul class="prog" id="prog"></ul>

<nav class="tabs" role="tablist">
  <button id="t-sq" role="tab" aria-selected="true"></button>
  <button id="t-tab" role="tab" aria-selected="false"></button>
  <button id="t-lib" class="lib" role="tab" aria-selected="false">Libertadores</button>
  <button id="t-sud" class="sud" role="tab" aria-selected="false">Sudamericana</button>
</nav>

<div class="betbar" id="betbar"></div>
<div class="pane on" id="p-sq">
  <div class="natrow" id="natrow"></div>
  <div class="sqgrid"><div id="clublist"></div><div id="pitch"></div></div>
</div>
<div class="pane" id="p-tab"><div class="natrow" id="natrow2"></div><div id="tabbody"></div></div>
<div class="pane lp" id="p-lib"><div class="subtabs" id="s-lib"></div><div id="c-lib"></div></div>
<div class="pane sp" id="p-sud"><div class="subtabs" id="s-sud"></div><div id="c-sud"></div></div>

<footer id="h-foot"></footer>
</div>

const PARTICLE=/^(de|da|do|dos|das|del|van|von|di|la|le)$/i;
const MACLIKE=/^(mac|mc|o'|d')$/i;
const JR=/^(j[úu]nior|jr\.?)$/i;
function shortClub(n){
  let s=n.replace(/\s*\([^)]*\)/,"").trim();
  if(s.length<=15) return s;
  const w=s.split(/\s+/);
  if(w.length>1){ const ab=w[0].length>4?w[0].slice(0,3)+".":w[0];
    let t=[ab].concat(w.slice(1)).join(" ");
    if(t.length>15) t=ab+" "+w[w.length-1];
    return t; }
  return s;
}
function shortName(n){
  const w=n.trim().split(/\s+/);
  if(w.length===1) return n;
  if(JR.test(w[w.length-1])) return w[0]+" Jr.";
  if(n.length<=13) return n;
  let i=w.length-1; while(i>0&&(PARTICLE.test(w[i-1])||MACLIKE.test(w[i-1]))) i--;
  const sur=w.slice(i).join(" ");
  const s=w[0][0]+". "+sur;
  return s.length<=17?s:sur;
}


function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let rnd=mulberry32(1);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));
  [a[i],a[j]]=[a[j],a[i]]}return a}

/* ---------- national draw ---------- */
function pickOrder(weights,k){
  const pool=[];
  for(const [c,w] of Object.entries(weights)) for(let i=0;i<k;i++) pool.push([c,w]);
  const out=[];
  while(pool.length){
    let t=0; for(const p of pool) t+=p[1];
    let r=rnd()*t, i=0;
    for(;i<pool.length;i++){ r-=pool[i][1]; if(r<=0) break }
    if(i>=pool.length) i=pool.length-1;
    out.push(pool[i][0]); pool.splice(i,1);
  }
  return out;
}
function okConstraint(o,co){ const c=CON[co]; if(!c) return true;
  return o.slice(0,c.top).filter(x=>c.any.includes(x)).length>=c.n }
function drawNation(co){
  const w=W[co], sq={};
  for(const club of Object.keys(w)) sq[club]=[];
  for(const pos of DRAWORDER){
    const list=POOL[co][pos], k=(pos==="Centre-Backs")?2:1;
    let order=pickOrder(w,k);
    if(CON[co]) for(let g=0;g<400&&!okConstraint(order,co);g++) order=pickOrder(w,k);
    order.forEach((club,i)=>{ const [nm,rt]=list[i];
      sq[club].push({n:nm,r:rt,pos:pos==="Centre-Backs"?"CB":SHORT[pos],pick:i+1}) });
  }
  const O={GK:0,RB:1,CB:2,LB:3,DM:4,CM:5,AM:6,RW:7,CF:8,LW:9};
  for(const c of Object.keys(sq)) sq[c].sort((a,b)=>O[a.pos]-O[b.pos]||a.pick-b.pick);
  return sq;
}

/* ---------- match engine ---------- */
const BASE=1.20, HOME=1.13, K=0.050, CAP=2.0;
const PW={GK:0.002,CB:0.030,RB:0.040,LB:0.040,DM:0.050,CM:0.100,AM:0.160,RW:0.170,LW:0.170,CF:0.300};
function pois(l){const L=Math.exp(-l);let p=1,n=0;
  for(;;){p*=rnd(); if(p<=L) return n; n++; if(n>14) return n}}
function wts(c){ if(c._w) return c._w;
  const w=c.squad.map(p=>PW[p.pos]*Math.exp(0.06*(p.r-c.r)));
  const t=w.reduce((a,b)=>a+b,0); return c._w=w.map(x=>x/t) }
function scorers(c,n){ if(!n) return [];
  const w=wts(c), out=[];
  for(let g=0;g<n;g++){ let x=rnd(),i=0; while(i<w.length-1&&(x-=w[i])>0) i++;
    out.push({name:c.squad[i].n,min:1+Math.floor(rnd()*90)}) }
  return out.sort((a,b)=>a.min-b.min) }
const TALLY={lib:{},sud:{}};
const CLEAN={lib:{},sud:{}};
function cs(comp,c,conceded){ if(!comp) return;
  const t=CLEAN[comp][c.key]=CLEAN[comp][c.key]||{cs:0,mp:0}; t.mp++; if(conceded===0) t.cs++ }
function credit(comp,c,l){ if(!comp) return;
  l.forEach(g=>{const k=g.name+"|"+c.name;
    (TALLY[comp][k]=TALLY[comp][k]||{n:g.name,club:c.name,co:c.co,goals:0}).goals++}) }
function game(a,b,neutral){
  const m=Math.min(CAP,Math.max(1/CAP,Math.exp(K*(a.r-b.r)))), h=neutral?1:HOME;
  const x=pois(BASE*m*h), y=pois(BASE/m/h);
  return [x,y,scorers(a,x),scorers(b,y)];
}
function tie(a,b,comp){
  const [a1,b1,sa1,sb1]=game(a,b,false), [b2,a2,sb2,sa2]=game(b,a,false);
  credit(comp,a,sa1); credit(comp,b,sb1); credit(comp,b,sb2); credit(comp,a,sa2);
  cs(comp,a,b1); cs(comp,b,a1); cs(comp,b,a2); cs(comp,a,b2);
  const A=a1+a2,B=b1+b2; let pens=null,winner;
  if(A!==B) winner=A>B?a:b; else winner=pens=(rnd()<0.5+0.004*(a.r-b.r)?a:b);
  return {a,b,legs:[[a1,b1],[b2,a2]],sc:[[sa1,sb1],[sb2,sa2]],agg:[A,B],winner,loser:winner===a?b:a,pens};
}
function oneOff(a,b,comp){
  const [x,y,sa,sb]=game(a,b,true);
  credit(comp,a,sa); credit(comp,b,sb); cs(comp,a,y); cs(comp,b,x);
  let pens=null,winner;
  if(x!==y) winner=x>y?a:b; else winner=pens=(rnd()<0.5+0.004*(a.r-b.r)?a:b);
  return {a,b,one:true,leg:[x,y],sc:[sa,sb],winner,loser:winner===a?b:a,pens};
}
function rec(comp,label,ties){ const St=comp==="lib"?S.L:S.D;
  (St.hist=St.hist||[]).push({label,ties}); betCheck(comp,label,ties); }
function pairSeed(cl){ const s=cl.slice().sort((x,y)=>y.total-x.total),n=s.length,o=[];
  for(let i=0;i<n/2;i++) o.push([s[i],s[n-1-i]]); return o }
function pairNat(cl){ const s=shuffle(cl),o=[];
  for(let i=0;i<s.length;i+=2) o.push([s[i],s[i+1]]); return o }
function playPairs(p,comp){ return p.map(x=>tie(x[0],x[1],comp)) }
function bracket(cl,comp){ return playPairs(pairSeed(cl),comp) }
/* round of 16: 1A-2B, 1C-2D, 1E-2F, 1G-2H | 1B-2A, 1D-2C, 1F-2E, 1H-2G */
const R16PAIR=[[0,1],[2,3],[4,5],[6,7],[1,0],[3,2],[5,4],[7,6]];
const pair16=(w,s)=>R16PAIR.map(x=>[w[x[0]],s[x[1]]]);
const pairNext=p=>{const o=[];for(let i=0;i<p.length;i+=2)o.push([p[i].winner,p[i+1].winner]);return o};
function bracket16(win,sec,comp){ return playPairs(pair16(win,sec),comp) }
function nextRound(prev,comp){ return playPairs(pairNext(prev),comp) }

function playGroup(g,comp){
  const t=g.map(c=>({c,Pts:0,GF:0,GA:0})), f=k=>t.find(x=>x.c.key===k);
  for(let i=0;i<g.length;i++) for(let j=0;j<g.length;j++){ if(i===j) continue;
    const [x,y,sx,sy]=game(g[i],g[j],false); credit(comp,g[i],sx); credit(comp,g[j],sy);
    cs(comp,g[i],y); cs(comp,g[j],x);
    const A=f(g[i].key),B=f(g[j].key); A.GF+=x;A.GA+=y;B.GF+=y;B.GA+=x;
    if(x>y)A.Pts+=3; else if(y>x)B.Pts+=3; else {A.Pts++;B.Pts++} }
  t.sort((a,b)=>b.Pts-a.Pts||(b.GF-b.GA)-(a.GF-a.GA)||b.GF-a.GF||b.c.total-a.c.total);
  return t;
}
function makeGroups(cl,n){
  const s=cl.slice().sort((a,b)=>b.total-a.total), pots=[];
  for(let p=0;p<s.length/n;p++) pots.push(shuffle(s.slice(p*n,(p+1)*n)));
  const G=Array.from({length:n},()=>[]);
  pots.forEach((pot,pi)=>{ const av=G.map((_,i)=>i);
    pot.forEach(c=>{ let k=av.findIndex(i=>G[i].length===pi&&!G[i].some(x=>x.co===c.co));
      if(k<0) k=av.findIndex(i=>G[i].length===pi);
      G[av[k]].push(c); av.splice(k,1) }) });
  return G;
}
const drawGroups=(cl,n,comp)=>makeGroups(cl,n).map(g=>playGroup(g,comp));


/* ---------- seleção do torneio ---------- */
function bestXI(comp,clubs,label){
  const goals={};
  Object.values(TALLY[comp]).forEach(r=>{goals[r.n+"|"+r.club]=r.goals});
  const slots=[["GK",1],["RB",1],["CB",2],["LB",1],["DM",1],["CM",1],["AM",1],["RW",1],["CF",1],["LW",1]];
  const BACK={GK:1,RB:1,CB:1,LB:1};
  const pool=[];
  clubs.forEach(c=>{ const t=CLEAN[comp][c.key]||{cs:0,mp:0};
    c.squad.forEach(p=>{ const g=goals[p.n+"|"+c.name]||0;
      pool.push({...p,club:c.name,co:c.co,clubKey:c.key,g,cs:t.cs,
        score: BACK[p.pos] ? p.r+2*t.cs : p.r+2*g}) }) });
  const xi=[];
  slots.forEach(([pos,n])=>{
    pool.filter(p=>p.pos===pos)
      .sort((a,b)=>b.score-a.score||b.g-a.g||b.r-a.r).slice(0,n)
      .forEach(p=>xi.push(p)) });
  return {name:label,squad:xi,co:null,_xi:true};
}
const xiSVG=(sq,aria,key)=>pitchFrame(pitchBody(sq,true,key),aria);
function award(comp,clubs,runs,title){
  const goals={}; Object.values(TALLY[comp]).forEach(r=>{goals[r.n+"|"+r.club]=r.goals});
  const BACK={GK:1,RB:1,CB:1,LB:1};
  let best=null;
  clubs.forEach(c=>{ const t=CLEAN[comp][c.key]||{cs:0}, bonus=runs[c.key]||0;
    c.squad.forEach(p=>{ const g=goals[p.n+"|"+c.name]||0;
      const sc=(BACK[p.pos]?p.r+2*t.cs:p.r+2*g)+bonus;
      if(!best||sc>best.sc) best={sc,p,c,g,cs:t.cs} }) });
  const b=best, line=BACK[b.p.pos]?`${b.cs} ${T("cs")}`:`${b.g} ${T("goals").toLowerCase()}`;
  return `<div class="king"><span class="ttl">${title}</span>
    <span class="who">${chip(b.c.key)}${esc(b.p.n)}</span>
    <span class="meta">${esc(b.c.name)} · ${b.p.pos} · ${line} · ${T("kingSub")}</span></div>`;
}
function xiBlock(title,sq,sub,aria,key){
  return `<div class="block"><h3>${title}</h3>${sub?`<p class="note" style="margin:0 0 8px">${sub}</p>`:""}
    <div class="xiwrap">${xiSVG(sq,aria||title,key)}</div></div>`;
}

const S={}; let step=0, log=[], MODE="modern";

function buildClubs(){
  S.ALL={};
  for(const co of COUNTRIES){
    const sq=drawNation(co);
    for(const [club,squad] of Object.entries(sq)){
      const total=squad.reduce((a,p)=>a+p.r,0), k=co+"|"+club;
      S.ALL[k]={key:k,name:club,co,squad,total,r:total/11};
    }
  }
}
const byCo=co=>Object.values(S.ALL).filter(c=>c.co===co).sort((a,b)=>b.total-a.total);
const alpha=co=>Object.values(S.ALL).filter(c=>c.co===co).sort((a,b)=>ptbr(a.name,b.name));

function qualifyModern(){
  const act=COUNTRIES.filter(c=>c!=="Mexico");
  const need={Brazil:7,Argentina:6}, sn={Brazil:6,Argentina:6};
  const taken=new Set(); S.lq={};
  for(const co of act){ const l=byCo(co).slice(0,need[co]||4); S.lq[co]=l; l.forEach(c=>taken.add(c.key)) }
  const rest=act.flatMap(byCo).filter(c=>!taken.has(c.key)).sort((a,b)=>b.total-a.total);
  const seen=new Set(); S.holders=[];
  for(const c of rest){ if(seen.has(c.co)) continue;
    if(byCo(c.co).filter(x=>!taken.has(x.key)).length-1 < (sn[c.co]||4)) continue;
    seen.add(c.co); S.holders.push(c); taken.add(c.key); if(S.holders.length===2) break }
  S.libDirect=S.holders.slice(); S.libP2=[]; S.libP1=[];
  for(const [co,l] of Object.entries(S.lq)) l.forEach((c,i)=>{ const s=i+1;
    if(co==="Brazil"||co==="Argentina") (s<=5?S.libDirect:S.libP2).push(c);
    else if(co==="Chile"||co==="Colombia") (s<=2?S.libDirect:S.libP2).push(c);
    else (s<=2?S.libDirect:(s===3?S.libP2:S.libP1)).push(c) });
  S.sq={};
  for(const co of act) S.sq[co]=byCo(co).filter(c=>!taken.has(c.key)).slice(0,sn[co]||4);
}
function qualifyOld(){
  // Libertadores: ARG/BRA 5, others 3, +1 extra for the holder's country
  const taken=new Set();
  const holder=COUNTRIES.flatMap(byCo).sort((a,b)=>b.total-a.total)[0];
  S.holders=[holder];
  const base={}, extra=holder.co;
  for(const co of COUNTRIES) base[co]=(co==="Brazil"||co==="Argentina")?5:3;
  base[extra]++;
  S.lq={}; S.libP1=[]; S.libDirect=[];
  for(const co of COUNTRIES){
    const l=byCo(co).slice(0,base[co]); S.lq[co]=l; l.forEach(c=>taken.add(c.key));
    const seeds=(co==="Brazil"||co==="Argentina")?4:2;
    l.forEach((c,i)=>{ (i<seeds?S.libDirect:S.libP1).push(c) });
  }
  S.sq={};
  for(const co of COUNTRIES) S.sq[co]=byCo(co).filter(c=>!taken.has(c.key)).slice(0,4);
}

  const inIt=groups.some(g=>g.some(r=>r.c.key===k));

function previewFor(i){
  const L=S.L, D=S.D;
  const M=MODE==="modern", n=M?i:(i<=5?i:i);
  const comp=(()=>{ const lbl=R()[i]||""; return lbl.indexOf("Sudamericana")===0?"sud":"lib" })();
  let pairs=null, groups=null;
  if(M){
    if(i===1) pairs=pend(()=>pairSeed(S.libP1));
    else if(i===2) pairs=pend(()=>pairSeed(S.libP2.concat(L.p1.map(t=>t.winner))));
    else if(i===3) pairs=pend(()=>pairSeed(L.p2.map(t=>t.winner)));
    else if(i===4) pairs=pend(sudPairs);
    else if(i===5) groups=pend(()=>makeGroups(S.libDirect.concat(L.p3.map(t=>t.winner)),8));
    else if(i===6) groups=pend(()=>makeGroups(sudField(L.drop,["Brazil","Argentina"]),8));
    else if(i===7) pairs=pend(()=>{const t=shuffle(L.third); return t.map((x,k)=>[x,D.second[k]])});
    else return koPreview(i-8);
  } else {
    if(i===1) pairs=pend(()=>pairSeed(S.libP1));
    else if(i===2) pairs=pend(sudPairs);
    else if(i===3) groups=pend(()=>makeGroups(S.libDirect.concat(L.p1.map(t=>t.winner)),8));
    else if(i===4) groups=pend(()=>makeGroups(sudField(L.drop,["Brazil","Argentina","Mexico"]),8));
    else if(i===5) pairs=pend(()=>{const t=shuffle(L.third); return t.map((x,k)=>[x,D.second[k]])});
    else return koPreview(i-6);
  }
  return {comp,pairs,groups};
}
function koPreview(n){
  const [rk,comp]=KO()[n], St=comp==="lib"?S.L:S.D;
  if(rk==="rFinal") return {comp,pairs:pend(()=>[[St.sf[0].winner,St.sf[1].winner]])};
  const key=KEYS[rk], prev={qf:"r16",sf:"qf"}[key];
  return {comp,pairs:pend(()=>key==="r16"?pair16(St.win,St.sec):pairNext(St[prev]))};
}

function advance(){
  const rr=R(); if(step>=rr.length) return;
  if(S.slow&&step>0&&!S.pvOn){
    const p=previewFor(step);
    S.pvOn=true; S.pvHTML=pvHTML(p); S.view=p.comp; render(); return;
  }
  S.pvOn=false; S.pvHTML=null;
  const L=S.L, D=S.D;
  if(step===0){
    buildClubs(); MODE==="old"?qualifyOld():qualifyModern();
    log.push(T("tSq").toUpperCase()+" "+T("orderNote")+"\n"
      +COUNTRIES.map(co=>CO(co)+": "+byCo(co).map(c=>c.name).join(", ")).join("\n"));
    step++; render(); return;
  }
  if(MODE==="modern") modernStep(step,L,D); else oldStep(step,L,D);
  step++; render();
}
function modernStep(i,L,D){
  switch(i){
  case 1: L.p1=playPairs(pend(()=>pairSeed(S.libP1)),"lib"); rec("lib",T("rP1"),L.p1); add("lib",T("rP1").charAt(0).toUpperCase()+T("rP1").slice(1),tiesBlock(T("rP1").charAt(0).toUpperCase()+T("rP1").slice(1),L.p1));
    S.view="lib"; log.push("LIBERTADORES — PRIMEIRA FASE\n"+L.p1.map(line).join("\n")); break;
  case 2: L.p2=playPairs(pend(()=>pairSeed(S.libP2.concat(L.p1.map(t=>t.winner)))),"lib");
    rec("lib",T("rP2G"),L.p2); add("lib",T("rP2G"),tiesBlock(T("rP2G"),L.p2));
    S.view="lib"; log.push("LIBERTADORES — SEGUNDA FASE\n"+L.p2.map(line).join("\n")); break;
  case 3: L.p3=playPairs(pend(()=>pairSeed(L.p2.map(t=>t.winner))),"lib"); L.drop=L.p3.map(t=>t.loser);
    rec("lib",T("rP3"),L.p3); add("lib",T("rP3").charAt(0).toUpperCase()+T("rP3").slice(1),tiesBlock(T("rP3").charAt(0).toUpperCase()+T("rP3").slice(1),L.p3,T("dropNote")));
    S.view="lib"; log.push("LIBERTADORES — TERCEIRA FASE\n"+L.p3.map(line).join("\n")); break;
  case 4: sudFirst(D); break;
  case 5: libGroups(L,S.libDirect.concat(L.p3.map(t=>t.winner))); break;
  case 6: sudGroups(D,L.drop,["Brazil","Argentina"]); break;
  case 7: sudPlayoff(L,D); break;
  default: koStep(i-8); }
}
function oldStep(i,L,D){
  switch(i){
  case 1: L.p1=playPairs(pend(()=>pairSeed(S.libP1)),"lib");
    rec("lib",T("rP1"),L.p1); add("lib",T("rP1").charAt(0).toUpperCase()+T("rP1").slice(1),tiesBlock(T("rP1").charAt(0).toUpperCase()+T("rP1").slice(1),L.p1,
      T("dropNoteOld")));
    S.view="lib"; log.push("LIBERTADORES — PRIMEIRA FASE\n"+L.p1.map(line).join("\n"));
    L.drop=L.p1.map(t=>t.loser).sort((a,b)=>b.total-a.total).slice(0,4); break;
  case 2: sudFirst(D); break;
  case 3: libGroups(L,S.libDirect.concat(L.p1.map(t=>t.winner)),T("rP2G")); break;
  case 4: sudGroups(D,L.drop,["Brazil","Argentina","Mexico"]); break;
  case 5: sudPlayoff(L,D); break;
  default: koStep(i-6); }
}
function sudPairs(){
  const direct=MODE==="old"?["Brazil","Argentina","Mexico"]:["Brazil","Argentina"];
  const p=[];
  for(const co of Object.keys(S.sq)){ if(direct.includes(co)) continue; p.push(...pairNat(S.sq[co])) }
  return p;
}
function sudFirst(D){
  D.p1=playPairs(pend(sudPairs),"sud");
  rec("sud",T("rP1"),D.p1); add("sud",T("rP1").charAt(0).toUpperCase()+T("rP1").slice(1),tiesBlock(T("natTitle"),D.p1,
    T("natNote")));
  S.view="sud"; log.push("SUDAMERICANA — PRIMEIRA FASE\n"+D.p1.map(line).join("\n"));
}
function libGroups(L,field,label){
  L.groups=pend(()=>makeGroups(field,8)).map(g=>playGroup(g,"lib"));
  L.third=L.groups.map(g=>g[2].c);
  L.win=L.groups.map(g=>g[0].c); L.sec=L.groups.map(g=>g[1].c);
  groupRec("lib",L.groups);
  add("lib",label||T("rGroupsShort"),groupsBlock(label||T("rGroupsShort"),L.groups));
  S.view="lib"; log.push(glog("LIBERTADORES — GRUPOS",L.groups));
}
function sudField(drop,direct){
  return direct.flatMap(co=>S.sq[co]||[]).concat(D0().p1.map(t=>t.winner)).concat(drop);
}
const D0=()=>S.D;
function sudGroups(D,drop,direct){
  D.groups=pend(()=>makeGroups(sudField(drop,direct),8)).map(g=>playGroup(g,"sud"));
  D.win=D.groups.map(g=>g[0].c); D.second=D.groups.map(g=>g[1].c);
  groupRec("sud",D.groups);
  add("sud",T("rGroupsShort"),groupsBlock(T("rGroupsShort"),D.groups));
  S.view="sud"; log.push(glog("SUDAMERICANA — GRUPOS",D.groups));
}
function sudPlayoff(L,D){
  const pr=pend(()=>{const t=shuffle(L.third); return t.map((x,i)=>[x,D.second[i]])});
  D.po=playPairs(pr,"sud");
  D.sec=D.po.map(x=>x.winner);
  rec("sud",T("rPO"),D.po); add("sud",T("rPO").charAt(0).toUpperCase()+T("rPO").slice(1),tiesBlock(T("poTitle"),D.po));
  S.view="sud"; log.push("SUDAMERICANA — PLAYOFF\n"+D.po.map(line).join("\n"));
}
const KEYS={rR16:"r16",rQF:"qf",rSF:"sf"};
function koStep(n){
  const [rk,comp]=KO()[n], St=comp==="lib"?S.L:S.D, other=comp==="lib"?"Lib":"Sud";
  if(rk==="rFinal") return finalOne(comp,St);
  const key=KEYS[rk], prev={qf:"r16",sf:"qf"}[key];
  St[key]=playPairs(pend(()=>key==="r16"?pair16(St.win,St.sec):pairNext(St[prev])),comp);
  rec(comp,T(rk),St[key]);
  add(comp,T(rk),tiesBlock(T(rk),St[key]));
  S.view=comp;
  log.push((comp==="lib"?"LIBERTADORES":"SUDAMERICANA")+" — "+T(rk).toUpperCase()+"\n"
    +St[key].map(line).join("\n"));
}
function finalOne(comp,St){
  const fp=pend(()=>[[St.sf[0].winner,St.sf[1].winner]])[0];
  const f=(MODE==="modern"?oneOff:tie)(fp[0],fp[1],comp);
  rec(comp,T("rFinal"),[f]);
  const tal=TALLY[comp], cl=CLEAN[comp];
  const dom=byCo(f.winner.co).findIndex(c=>c.key===f.winner.key)+1;
  const gp=(St.gpos||{})[f.winner.key];
  const gline=gp?`<div class="r"><b>${T("rGroupsShort")}</b><span>${T("group")} ${gp.g}</span>
    <span class="sc">${gp.p}º · ${gp.pts} ${T("pts")}</span></div>`:"";
  const rest=(St.hist||[]).map(h=>{
    const t=h.ties.find(x=>x.a.key===f.winner.key||x.b.key===f.winner.key);
    if(!t) return "";
    const home=t.a.key===f.winner.key, opp=home?t.b:t.a;
    const sc=t.one?(home?t.leg[0]+"–"+t.leg[1]:t.leg[1]+"–"+t.leg[0])
                  :(home?t.agg[0]+"–"+t.agg[1]:t.agg[1]+"–"+t.agg[0]);
    const mine=t.one?(home?t.sc[0]:t.sc[1])
      :(home?t.sc[0][0].concat(t.sc[1][1]):t.sc[0][1].concat(t.sc[1][0]));
    const tal={}; mine.forEach(g=>{tal[g.name]=(tal[g.name]||0)+1});
    const gl=Object.entries(tal).map(([n,c])=>esc(shortName(n))+(c>1?" ("+c+")":"")).join(", ");
    return `<div class="r"><b>${h.label}</b><span>${fl(opp.co)}${esc(opp.name)}</span>
      <span class="sc">${sc}${t.pens?" p":""}</span></div>`
      +(gl?`<div class="rg">${gl}</div>`:"");
  }).filter(Boolean).join("");
  const path=gline+rest;
  const extra=`<div class="block"><h3>${T("path")}</h3><div class="pathbox">${path}</div>
    <p class="dompos">${dom}${T("domestic")} — ${CO(f.winner.co)}</p></div>`;
  add(comp,T("rFinal"),tiesBlock(T("rFinal"),[f])+champBlock(f.winner.name)+extra
    +xiBlock(T("champXI"),f.winner.squad.map(p=>({...p,cs:(cl[f.winner.key]||{}).cs||0,
      g:(Object.values(tal).find(r=>r.n===p.n&&r.club===f.winner.name)||{}).goals||0})),
      esc(f.winner.name)+" · "+CO(f.winner.co),T("champXI"),f.winner.key));
  const qf=St.qf.flatMap(t=>[t.a,t.b]);
  const runs={}; St.sf.flatMap(t=>[t.a,t.b]).forEach(c=>runs[c.key]=2);
  [f.a,f.b].forEach(c=>runs[c.key]=4); runs[f.winner.key]=8;
  add(comp,T("selTab"),award(comp,qf,runs,T(comp==="lib"?"king":"prince"))
    +xiBlock(T("bestXI"),bestXI(comp,qf,"x").squad,T("selNote"),
      T("bestXI")+" — "+(comp==="lib"?"Libertadores":"Sudamericana")));
  St.champ=f.winner;
  S.tab[comp]=S.blocks[comp].length-2; S.view=comp;
  const cname=comp==="lib"?"LIBERTADORES":"SUDAMERICANA";
  const xiTxt=sq=>sq.map(p=>p.pos.padEnd(3)+" "+p.n+(p.club?" ("+p.club+")":"")).join("\n");
  const sel=bestXI(comp,qf,"x").squad;
  const kg=(()=>{ const g={}; Object.values(TALLY[comp]).forEach(r=>{g[r.n+"|"+r.club]=r.goals});
    const BK={GK:1,RB:1,CB:1,LB:1}; let b=null;
    qf.forEach(c=>{ const t=(CLEAN[comp][c.key]||{cs:0}), bo=runs[c.key]||0;
      c.squad.forEach(p=>{ const gg=g[p.n+"|"+c.name]||0;
        const s=(BK[p.pos]?p.r+2*t.cs:p.r+2*gg)+bo;
        if(!b||s>b.s) b={s,n:p.n,c:c.name} }) });
    return b })();
  log.push(cname+" — "+T("champion").toUpperCase()+": "+f.winner.name+" ("+CO(f.winner.co)+")"
    +"\n\n"+T("champXI").toUpperCase()+"\n"+xiTxt(f.winner.squad)
    +"\n\n"+T(comp==="lib"?"king":"prince").toUpperCase()+": "+kg.n+" ("+kg.c+")"
    +"\n\n"+T("bestXI").toUpperCase()+"\n"+xiTxt(sel));
}
el("next").onclick=advance;
el("all").onclick=()=>{const s=S.slow; S.slow=false; S.pvOn=false; while(step<R().length) advance(); S.slow=s; S.view="lib"; render()};
el("reset").onclick=()=>{el("seed").value=String(1+Math.floor(Math.random()*999999)); reset()};
el("seed").onchange=reset;
el("mode").onchange=reset;
el("slow").onchange=e=>{S.slow=e.target.checked; S.pvOn=false; render()};
el("beton").onchange=e=>{S.betOn=e.target.checked; if(!S.betOn) S.bet=null; render()};
el("lang").onchange=()=>{
  const at=step, view=S.view, tabs={...S.tab}, co=S.co, club=S.club;
  LANG=el("lang").value; chrome();
  reset(); while(step<at) advance();
  S.view=view; S.tab=tabs; S.co=co; S.club=club; render();
};
function chrome(){
  el("h-title").textContent=T("title"); el("h-sub").textContent=T("sub");
  el("h-foot").textContent=T("foot");
  el("lb-seed").textContent=T("seed"); el("lb-mode").textContent=T("format");
  el("lb-lang").textContent=T("lang");
  el("mode").options[0].textContent=T("fmodern"); el("mode").options[1].textContent=T("fold");
  el("all").textContent=T("simAll"); el("reset").textContent=T("reset");
  el("dump").textContent=T("copy");
  el("lb-slow").textContent=T("slow");
  el("lb-beton").textContent=T("betOn");
  el("t-sq").textContent=T("tSq"); el("t-tab").textContent=T("tTab");
  document.documentElement.lang=LANG==="es"?"es":"pt-BR";
  document.title=T("title");
}
["sq","tab","lib","sud"].forEach(k=>el("t-"+k).onclick=()=>{S.view=k; render()});
["natrow","natrow2"].forEach(id=>el(id).onclick=e=>{
  const b=e.target.closest("button[data-co]"); if(b){S.co=b.dataset.co; S.club=null; render()}});
["p-lib","p-sud"].forEach(p=>el(p).onclick=e=>{
  const n=e.target.closest("[data-club]"); if(!n) return;
  const k=n.dataset.club; if(!S.ALL[k]) return;
  S.view="sq"; S.co=k.split("|")[0]; S.club=k; render();
});
el("clublist").onclick=e=>{const li=e.target.closest("li[data-k]"); if(li){S.club=li.dataset.k; render()}};
["lib","sud"].forEach(c=>el("s-"+c).onclick=e=>{
  const b=e.target.closest("button[data-i]"); if(!b) return;
  S.tab[c]=b.dataset.i==="art"?"art":+b.dataset.i; render()});
el("dump").onclick=()=>{
  const top=c=>Object.values(TALLY[c]).sort((a,b)=>b.goals-a.goals).slice(0,10)
    .map(r=>`${r.goals}  ${r.n} (${r.club})`).join("\n");
  navigator.clipboard?.writeText(
    T("title")+" · "+T("seed")+" "+el("seed").value+" · "+(MODE==="modern"?T("fmodern"):T("fold"))
    +"\n\n"+log.join("\n\n")
    +"\n\n"+T("scorersOf")+" — LIBERTADORES\n"+top("lib")
    +"\n\n"+T("scorersOf")+" — SUDAMERICANA\n"+top("sud"));
  el("dump").textContent=T("copied"); setTimeout(()=>el("dump").textContent=T("copy"),1400);
};
el("seed").value=String(1+Math.floor(Math.random()*999999));
chrome();
reset();
</script>
</body>
