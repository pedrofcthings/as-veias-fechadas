<style>
:root{
  --paper:#E5E3DB; --panel:#F1EFE9; --ink:#1A2430; --muted:#6E7480;
  --rule:#C3C0B5; --hair:#D5D2C8;
  --lib:#9C7B18; --lib-soft:#F0E7CE;
  --sud:#8E332A; --sud-soft:#F1DFDA;
  --turf:#CBD2BE;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper); color:var(--ink);
  font-family:Vollkorn,Georgia,serif; font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:"Sorts Mill Goudy",Georgia,serif; font-weight:400}
.wrap{max-width:1120px; margin:0 auto; padding:30px 24px 80px}
header{border-bottom:2px solid var(--ink); padding-bottom:13px}
h1{font-size:33px; margin:0 0 2px}
.sub{color:var(--ink); font-size:15.5px; margin:0 0 3px; max-width:64ch}
.sub2{color:var(--muted); font-size:14px; font-style:italic; margin:0}

.controls{display:flex; gap:15px; align-items:flex-end; flex-wrap:wrap;
  padding:13px 0 14px; border-bottom:1px solid var(--rule)}
label{display:block; font-size:13px; color:var(--muted); margin-bottom:3px}
input[type=number]{font-family:Vollkorn,serif; font-size:17px; width:104px; padding:5px 8px;
  border:1px solid var(--rule); background:var(--panel); color:var(--ink); border-radius:0;
  font-variant-numeric:tabular-nums}
input:focus-visible,button:focus-visible{outline:2px solid var(--ink); outline-offset:2px}
.betbar:empty{display:none}
.betbar{margin:14px 0 0; padding:12px 15px; border:1px solid var(--rule); background:var(--panel);
  display:flex; align-items:center; gap:10px 14px; flex-wrap:wrap; font-size:15px}
.betbar .ask{font-family:"Sorts Mill Goudy",serif; font-size:17px}
.betbar select{font-size:15px; padding:4px 7px; max-width:210px; display:block}
.betbar label.bl{display:flex; flex-direction:column; gap:2px}
.betbar label.bl span{font-size:12px; color:var(--muted)}
.betbar button{font-size:14px; padding:5px 13px}
.betbar .st{font-size:14px; color:var(--muted); font-style:italic}
.betbar .ok{color:var(--lib); font-style:normal; font-weight:700}
.betbar .ko{color:var(--sud); font-style:normal}
.cl-link{cursor:pointer; border-bottom:1px dotted var(--rule)}
.cl-link:hover{border-bottom-color:var(--ink)}
.star{color:var(--lib); font-weight:700; margin-right:3px}
.sp .star{color:var(--sud)}
.pathbox{margin:10px 0 0; font-size:14.5px}
.pathbox .r{display:grid; grid-template-columns:120px 1fr auto; gap:10px;
  border-bottom:1px solid var(--hair); padding:3px 0}
.pathbox .r b{font-weight:400; color:var(--muted); font-size:13px}
.pathbox .sc{font-variant-numeric:tabular-nums; font-weight:700}
.pathbox .rg{font-size:12.5px; color:var(--muted); font-style:italic;
  padding:2px 0 4px 130px; border-bottom:1px solid var(--hair)}
.dompos{font-size:13.5px; color:var(--muted); font-style:italic; margin:4px 0 0}
.actionbar{display:flex; align-items:center; gap:16px; margin:16px 0 4px; flex-wrap:wrap}
#next{font-size:19px; padding:12px 30px; box-shadow:3px 3px 0 var(--rule); letter-spacing:.2px}
#next:not(:disabled):hover{transform:translate(1px,1px); box-shadow:2px 2px 0 var(--rule)}
.progline{font-size:13.5px; color:var(--muted); font-style:italic}
button{font-family:Vollkorn,serif; font-size:16px; padding:7px 17px; cursor:pointer;
  border:1px solid var(--ink); background:var(--ink); color:var(--panel); border-radius:0}
button.ghost{background:transparent; color:var(--ink)}
button:disabled{opacity:.35; cursor:default}
.check{display:flex; align-items:center; gap:6px; font-size:14px; color:var(--muted);
  padding-bottom:6px; cursor:pointer}
.check input{accent-color:var(--ink); width:15px; height:15px}
.toggles{display:flex; gap:14px; flex-wrap:wrap; padding-bottom:5px}
.check input:disabled+span{opacity:.45}
#dump[hidden]{display:none}
select{font-family:Vollkorn,serif; font-size:16px; padding:5px 7px; border:1px solid var(--rule);
  background:var(--panel); color:var(--ink); border-radius:0}
.ltab{max-width:520px}
.ltab td.pos{width:30px; color:var(--muted)}

/* progress strip */
.prog[hidden]{display:none}
.ghost.tiny{font-size:12px; padding:3px 9px; letter-spacing:.02em}
.prog{display:flex; gap:0; flex-wrap:wrap; margin:12px 0 0; padding:0; list-style:none;
  border-top:1px solid var(--hair)}
.prog li{font-size:12.5px; color:var(--muted); padding:5px 11px 5px 0; display:flex; gap:5px}
.prog li b{font-weight:400; font-variant-numeric:tabular-nums; opacity:.55}
.prog li.done{color:var(--ink)}
.prog li.now{color:var(--ink); font-weight:600}

/* tabs */
.tabs{display:flex; gap:0; margin:20px 0 0; border-bottom:2px solid var(--ink)}
.tabs button{background:transparent; color:var(--muted); border:none; border-bottom:2px solid transparent;
  margin-bottom:-2px; font-size:19px; font-family:"Sorts Mill Goudy",serif; padding:5px 20px 6px}
.tabs button[aria-selected=true]{color:var(--ink); border-bottom-color:var(--ink)}
.tabs button.lib[aria-selected=true]{color:var(--lib); border-bottom-color:var(--lib)}
.tabs button.sud[aria-selected=true]{color:var(--sud); border-bottom-color:var(--sud)}
.subtabs{display:flex; flex-wrap:wrap; gap:0 4px; padding:11px 0 4px; border-bottom:1px solid var(--hair);
  margin-bottom:20px}
.subtabs button{background:transparent; border:1px solid transparent; color:var(--muted);
  font-size:14px; padding:3px 10px}
.subtabs button[aria-selected=true]{border-color:var(--rule); background:var(--panel); color:var(--ink)}
.pane{display:none} .pane.on{display:block}

.block{margin:0 0 26px}
.block h3{font-size:18px; margin:0 0 8px; border-bottom:1px solid var(--rule); padding-bottom:3px}
.tie{border-bottom:1px solid var(--hair); padding:6px 0}
.leg{display:grid; grid-template-columns:1fr 52px 1fr; gap:9px; align-items:baseline; font-size:15.5px}
.leg .h{text-align:right}
.leg .sc{text-align:center; font-variant-numeric:tabular-nums; color:var(--muted); font-size:14px}
.gl{display:grid; grid-template-columns:1fr 52px 1fr; gap:9px; font-size:12.5px;
  color:var(--muted); font-style:italic; line-height:1.35; margin:1px 0 3px}
.gl .h{text-align:right}
.agg{display:grid; grid-template-columns:1fr 52px 1fr; gap:9px; align-items:baseline;
  font-size:16px; margin-top:2px}
.agg .h{text-align:right}
.agg .sc{text-align:center; font-variant-numeric:tabular-nums; font-weight:700}
.win{font-weight:700}
.lp .win{color:var(--lib)} .sp .win{color:var(--sud)}
.out{color:var(--muted)}
.note{font-size:13px; color:var(--muted); font-style:italic; margin:4px 0 0}
table{width:100%; border-collapse:collapse; font-size:14.5px}
th{text-align:left; font-weight:600; font-size:13px; color:var(--muted);
  border-bottom:1px solid var(--rule); padding:3px 4px}
td{padding:3px 4px; border-bottom:1px solid var(--hair); font-variant-numeric:tabular-nums}
td.club{font-variant-numeric:normal}
th.num,td.num{text-align:right; width:36px}
tr.qual td{font-weight:600}
.lp tr.qual td.club{color:var(--lib)} .sp tr.qual td.club{color:var(--sud)}
.groups{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px 26px}
.groups h4{margin:0 0 3px; font-size:15px}
.champ{margin-top:8px; padding:16px 18px; border:2px solid}
.lp .champ{border-color:var(--lib); background:var(--lib-soft)}
.sp .champ{border-color:var(--sud); background:var(--sud-soft)}
.champ .lbl{font-size:13px; color:var(--muted); margin:0}
.king{margin:0 0 20px; padding:13px 16px; border:1px solid var(--rule); background:var(--panel);
  display:flex; align-items:baseline; gap:12px; flex-wrap:wrap}
.king .ttl{font-family:"Sorts Mill Goudy",serif; font-size:20px}
.lp .king{border-left:4px solid var(--lib)} .sp .king{border-left:4px solid var(--sud)}
.king .who{font-size:19px; font-weight:700}
.king .meta{font-size:13.5px; color:var(--muted); font-style:italic}
.champ .who{font-family:"Sorts Mill Goudy",serif; font-size:30px; margin:1px 0 0}
.fl{width:15px; height:10px; vertical-align:-1px; margin:0 5px; border:.5px solid rgba(0,0,0,.25)}
.empty{color:var(--muted); font-style:italic; font-size:15px}

/* squads */
.natrow{display:flex; flex-wrap:wrap; gap:0 4px; padding-bottom:12px; margin-bottom:18px;
  border-bottom:1px solid var(--hair)}
.natrow button{background:transparent; border:1px solid transparent; color:var(--muted);
  font-size:14px; padding:3px 9px; display:flex; align-items:center}
.natrow button[aria-selected=true]{border-color:var(--rule); background:var(--panel); color:var(--ink)}
.natrow button.cont{font-variant:small-caps; letter-spacing:.04em}
.natrow .sep{width:1px; background:var(--rule); margin:2px 10px; align-self:stretch; flex:0 0 auto}
.sqgrid{display:grid; grid-template-columns:212px 1fr; gap:28px; align-items:start}
@media(max-width:760px){.sqgrid{grid-template-columns:1fr}}
ul.clublist{list-style:none; margin:0; padding:0}
ul.clublist li{display:grid; grid-template-columns:1fr auto; gap:8px; font-size:15px;
  border-bottom:1px solid var(--hair); padding:4px 3px; cursor:pointer}
ul.clublist li:hover{background:var(--panel)}
ul.clublist li[aria-selected=true]{background:var(--panel); font-weight:600;
  box-shadow:inset 2px 0 0 var(--ink)}
ul.clublist li b{font-weight:400; font-variant-numeric:tabular-nums; color:var(--muted)}
.pitchwrap h3{font-size:20px; margin:0 0 2px}
.pitchwrap .m{font-size:13.5px; color:var(--muted); margin:0 0 10px; font-style:italic}
svg.pitch{width:100%; max-width:460px; height:auto; display:block; overflow:visible}
svg.pitch .turf{fill:var(--turf)}
svg.pitch .ln{fill:none; stroke:#FFF; stroke-width:.5; opacity:.85}
svg.chip{width:13px;height:13px;vertical-align:-2px;margin-right:6px}
ul.clublist li span{display:flex;align-items:center}
.pitchwrap h3 svg.chip{width:15px;height:15px;vertical-align:-2px}
svg.pitch text{font-family:Vollkorn,serif; fill:var(--ink)}
svg.pitch text.nm{font-size:4.1px; text-anchor:middle}
svg.pitch text.po{font-size:3.2px; text-anchor:middle; fill:var(--muted)}
svg.pitch text.cl{font-size:2.7px; text-anchor:middle; fill:var(--muted); font-style:italic}
.xiwrap{max-width:460px}
footer{margin-top:44px; padding-top:12px; border-top:1px solid var(--rule);
  font-size:13px; color:var(--muted)}

/* ---------- mobile ---------- */
@media(max-width:640px){
  .wrap{padding:18px 13px 90px}
  h1{font-size:25px} .sub{font-size:14px} .sub2{font-size:12.5px}
  .controls{gap:10px 12px; padding:11px 0 12px}
  .controls>div{flex:1 1 128px}
  input[type=number],select{width:100%; font-size:16px}
  .controls button.ghost{flex:1 1 auto; font-size:14px; padding:6px 10px}
  .actionbar{position:sticky; bottom:0; z-index:5; margin:12px -13px 0; padding:10px 13px;
    background:var(--paper); border-top:1px solid var(--rule); gap:8px}
  #next{width:100%; font-size:17px; padding:13px 12px; box-shadow:none}
  .progline{width:100%; text-align:center; font-size:12.5px}
  .prog li{padding-right:9px}
  .tabs{overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{font-size:16px; padding:5px 13px 6px; white-space:nowrap}
  .subtabs,.natrow{overflow-x:auto; flex-wrap:nowrap; scrollbar-width:none; padding-bottom:8px}
  .subtabs::-webkit-scrollbar,.natrow::-webkit-scrollbar{display:none}
  .subtabs button,.natrow button{white-space:nowrap; flex:0 0 auto}
  .block h3{font-size:16px}
  .leg{grid-template-columns:1fr 44px 1fr; gap:5px; font-size:13.5px}
  .agg{grid-template-columns:1fr 44px 1fr; gap:5px; font-size:14px}
  .gl{grid-template-columns:1fr 44px 1fr; gap:5px; font-size:11px}
  .fl{width:13px; height:9px; margin:0 3px}
  table{font-size:13px} th{font-size:12px}
  .groups{grid-template-columns:1fr; gap:16px}
  .sqgrid{grid-template-columns:1fr; gap:14px}
  ul.clublist{max-height:190px; overflow-y:auto; border:1px solid var(--hair)}
  ul.clublist li{font-size:14px; padding:6px 8px}
  svg.pitch,.xiwrap{max-width:100%}
  .king{gap:6px 10px; padding:11px 13px} .king .ttl{font-size:17px} .king .who{font-size:16px}
  .champ .who{font-size:24px}
  .betbar{font-size:14px; padding:10px 12px; gap:8px 10px}
  .betbar .ask{font-size:15px; width:100%}
  .betbar select{max-width:none; flex:1 1 100%; font-size:16px}
  .betbar button{flex:1 1 auto}
  .toggles{width:100%; gap:16px}
  .pathbox .r{grid-template-columns:84px 1fr auto; gap:7px; font-size:13px}
  .pathbox .rg{padding-left:91px; font-size:11.5px}
  .ltab{max-width:100%}
  footer{font-size:12px}
}
@media(max-width:640px) and (display-mode:browser){ body{-webkit-text-size-adjust:100%} }
@media(prefers-reduced-motion:no-preference){
  .pane.on .block{animation:rise .26s ease-out}
  @keyframes rise{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>

<div class="wrap">
<header>
  <h1 id="h-title">As Veias Fechadas</h1>
  <p class="sub" id="h-sub"></p>
  <p class="sub2" id="h-sub2"></p>

  let ww=s.split(/\s+/);

function pickOrder(weights,k){
  const pool=[];

  while(pool.length){

    for(;i<pool.length;i++){ r-=pool[i][1]; if(r<=0) break }
    if(i>=pool.length) i=pool.length-1;

}

const BASE=1.20, HOME=1.13, K=0.050, CAP=2.0;

  const t=g.map(c=>({c,Pts:0,GF:0,GA:0})), f=k=>t.find(x=>x.c.key===k);

/* Team strength by sector rather than a flat mean of eleven. A club attacks with
   its forwards and midfield and defends with its back four, keeper and midfield,
   so a genuine star in one third now moves that third instead of being diluted
   across the whole side. Attack and defence are recentred against each other so
   the goal average stays where it was calibrated. */
const SECW={att:{ATT:0.50,MID:0.35,DEF:0.15,GK:0.00},
            def:{DEF:0.45,GK:0.25,MID:0.30,ATT:0.00}};
const SECOF={GK:"GK",RB:"DEF",CB:"DEF",LB:"DEF",DM:"MID",CM:"MID",AM:"MID",
             RW:"ATT",CF:"ATT",LW:"ATT"};
function sectors(c){
  const s={GK:[0,0],DEF:[0,0],MID:[0,0],ATT:[0,0]};
  for(const p of c.squad){ const k=SECOF[p.pos]; s[k][0]+=p.r; s[k][1]++ }
  const o={}; for(const k in s) o[k]=s[k][1]?s[k][0]/s[k][1]:c.r;
  return o;
}
function retotal(){
  let sa=0, sd=0, n=0;
  for(const c of Object.values(S.ALL)){
    c.total=c.squad.reduce((a,p)=>a+p.r,0); c.r=c.total/11; delete c._w;
    const s=sectors(c);
    c.att=SECW.att.ATT*s.ATT+SECW.att.MID*s.MID+SECW.att.DEF*s.DEF;
    c.def=SECW.def.DEF*s.DEF+SECW.def.GK*s.GK+SECW.def.MID*s.MID;
    sa+=c.att; sd+=c.def; n++;
  }
  const shift=(sa-sd)/n;
  for(const c of Object.values(S.ALL)) c.def+=shift;
}
/* two foreigners per club, drawn on continental pull (assoc coefficient ^0.7
   x share of own league's tickets, then cubed). A club only signs a player who
   improves its weakest man in that position, so nobody signs a downgrade. */
const NOFGN=["Spain|Athletic Club"];
function drawForeign(){
  const w={}; for(const k of Object.keys(CONT)) w[k]=Math.pow(CONT[k],5);
  for(const k of NOFGN) delete w[k];
  const order=pickOrder(w,FSLOTS), taken=new Set();
  S.foreign=[];
  for(const key of order){
    const c=S.ALL[key];
    for(let i=0;i<FPOOL.length;i++){
      if(taken.has(i)) continue;
      const f=FPOOL[i];
      const slots=c.squad.filter(p=>p.pos===f[2]&&!p.foreign);
      if(!slots.length) continue;
      const worst=slots.reduce((a,b)=>a.r<b.r?a:b);
      if(f[1]<=worst.r) continue;
      worst.n=f[0]; worst.r=f[1]; worst.foreign=true;
      taken.add(i); S.foreign.push({n:f[0],r:f[1],pos:f[2],club:c.name,co:c.co,key:c.key});
      break;
    }
  }
}

  const seen=new Set(); q.holders=[];
  for(const c of rest){ if(seen.has(c.co)) continue;
    if(byCo(c.co).filter(x=>!taken.has(x.key)).length-1<(sn[c.co]||4)) continue;
    seen.add(c.co); q.holders.push(c); taken.add(c.key); if(q.holders.length===2) break }

  for(const [co,l] of Object.entries(q.lq)) l.forEach((c,i)=>{ const s=i+1;

    else if(co==="Argentina") (s<=3?q.direct:q.p2).push(c);
    else if(co==="Chile"||co==="Colombia"||co==="Mexico") (s<=2?q.direct:q.p2).push(c);
    else (s<=2?q.direct:(s===3?q.p2:q.p1)).push(c) });
  q.sq={};
  for(const co of act) q.sq[co]=byCo(co).filter(c=>!taken.has(c.key)).slice(0,sn[co]||4);
}
function qualEu(){
  const q=Q.eu, taken=new Set(); q.lq={}; q.direct=[]; q.p1=[]; q.p2=[];
  for(const co of EURO){ const l=byCo(co).slice(0,SLOTS[co]); q.lq[co]=l; l.forEach(c=>taken.add(c.key)) }
  const qual=[];
  for(const co of EURO){ const d=SLOTS[co]===4?3:SLOTS[co]===3?2:0;
    q.lq[co].forEach((c,i)=>{ (i<d?q.direct:qual).push(c) }) }
  const holder=EURO.flatMap(byCo).sort((a,b)=>b.total-a.total)[0]; q.holders=[holder];
  const hi=qual.findIndex(c=>c.key===holder.key);
  if(hi>=0){ qual.splice(hi,1); q.direct.push(holder) }
  else { qual.sort((a,b)=>b.total-a.total); q.direct.push(qual.shift()) }
  q.p1=qual; q.sq={};
  for(const co of EURO) q.sq[co]=byCo(co).filter(c=>!taken.has(c.key)).slice(0,2);
}
function qualOldC(k){                       /* champions-only: 32 clubs a side */
  const q=Q[k], cos=CONTS[k].cos, n={}, taken=new Set();
  if(k==="eu") for(const co of cos) n[co]=TOP10.includes(co)?2:1;
  else { for(const co of cos) n[co]=3; n[AMRANK[10]]=2 }
  q.lq={}; q.direct=[]; q.p1=[]; q.p2=[];
  for(const co of cos){ const l=byCo(co).slice(0,n[co]); q.lq[co]=l;
    l.forEach(c=>taken.add(c.key)); q.direct.push(...l) }
  q.holders=[cos.flatMap(byCo).sort((a,b)=>b.total-a.total)[0]];
  q.sq={};
  for(const co of cos) q.sq[co]=byCo(co).filter(c=>!taken.has(c.key)).slice(0,n[co]);
}
/* Libertadores antiga: 12 na primeira fase (1 por país + 1 extra do país do
   detentor), 26 diretos na segunda (BRA 4, ARG 4, demais 2), 8 grupos de 4. */
function qualAmOld(){
  const q=Q.am, act=AMER, nLib={Brazil:5,Argentina:5}, nSud={Brazil:8,Argentina:6};
  const taken=new Set(); q.lq={};
  for(const co of act){ const l=byCo(co).slice(0,nLib[co]||3); q.lq[co]=l;
    l.forEach(c=>taken.add(c.key)) }
  const holder=act.flatMap(byCo).sort((a,b)=>b.total-a.total)[0];
  q.holders=[holder];
  const extra=byCo(holder.co).filter(c=>!taken.has(c.key))[0];
  if(extra) taken.add(extra.key);
  q.direct=[]; q.p1=[]; q.p2=[];
  for(const [co,l] of Object.entries(q.lq)){ const d=(co==="Brazil"||co==="Argentina")?4:2;
    l.forEach((c,i)=>{ (i<d?q.direct:q.p1).push(c) }) }
  if(extra) q.p1.push(extra);
  q.sq={};
  for(const co of act) q.sq[co]=byCo(co).filter(c=>!taken.has(c.key)).slice(0,nSud[co]||4);
}
const QUAL={am:qualAm,eu:qualEu};
const QUALOLD={am:qualAmOld,eu:qualOldC};

/* ---------- second-tier field, per continent ---------- */
function sudPairsC(k){
  const q=Q[k];
  if(k==="am"){ const direct=["Brazil","Argentina"], p=[];
    for(const co of Object.keys(q.sq)){ if(direct.includes(co)) continue; p.push(...pairNat(q.sq[co])) }
    return p }
  const f=Object.values(q.sq).flat().concat(S.C.ucl.drop||[]).sort((a,b)=>b.total-a.total);
  q.bye=f.slice(0,16); return pairSeed(f.slice(16));
}
function sudFieldC(k){
  const q=Q[k], B=S.C[CONTS[k].B];
  if(k==="am") return ["Brazil","Argentina"].flatMap(co=>q.sq[co]||[])
    .concat(B.p1.map(t=>t.winner)).concat(MODE==="old"?[]:(S.C.lib.drop||[]));
  return (q.bye||[]).concat(B.p1.map(t=>t.winner));
}

/* ---------- phases ---------- */
const PH_MOD=["p1","p2","p3","sp1","lg","sg","spo","r16B","r16A","qfB","qfA","sfB","sfA","finB","finA"];
const PH_OLD=["p1","sp1","r32A","lg","r32B","r16B","r16A","qfB","qfA","sfB","sfA","finB","finA"];
/* no modo antigo a América joga preliminar + grupos e a Europa entra direto na
   trigésima segunda, então nem toda fase se aplica aos dois continentes. */
const PHK=(k,ph)=>MODE!=="old"?true
  :(ph==="p1"||ph==="lg"||ph==="sp1")?k==="am":ph==="r32A"?k==="eu":true;
const PHR={p1:"rP1",p2:"rP2",p3:"rP3",sp1:"rP1",lg:"rGroups",sg:"rGroups",spo:"rPO",
  r32A:"rR32",r32B:"rR32",r16A:"rR16",r16B:"rR16",qfA:"rQF",qfB:"rQF",
  sfA:"rSF",sfB:"rSF",finA:"rFinal",finB:"rFinal"};
const PHSIDE=ph=>(ph==="sp1"||ph==="sg"||ph==="spo"||/B$/.test(ph))?"B":"A";
const KEYS2={r16:"rR16",qf:"rQF",sf:"rSF"};
function PHASES(){
  let p=(MODE==="old"?PH_OLD:PH_MOD).slice();
  if(!useB()) p=p.filter(x=>PHSIDE(x)!=="B");
  return p;
}
function koPairs(St,key,prev){
  if(MODE==="old"){
    if(key==="r16"&&!St.r32) return pair16(St.win,St.sec);
    return pairNat((key==="r16"?St.r32:St[prev]).map(t=>t.winner)) }
  return key==="r16"?pair16(St.win,St.sec):pairNext(St[prev]);
}
function put(comp,lbl,ties,note){
  rec(comp,lbl,ties); add(comp,lbl,tiesBlock(lbl,ties,note)); S.view=comp;
  log.push(CN(comp).toUpperCase()+" — "+lbl.toUpperCase()+"\n"+ties.map(line).join("\n"));
}
function groupsPhase(comp,field){
  const St=S.C[comp];
  St.groups=pend(()=>makeGroups(field,8)).map(g=>playGroup(g,comp));
  St.third=St.groups.map(g=>g[2].c);
  St.win=St.groups.map(g=>g[0].c); St.sec=St.groups.map(g=>g[1].c);
  St.second=St.groups.map(g=>g[1].c);
  groupRec(comp,St.groups);
  add(comp,T("rGroupsShort"),groupsBlock(T("rGroupsShort"),St.groups)); S.view=comp;
  log.push(glog(CN(comp).toUpperCase()+" — "+T("rGroupsShort").toUpperCase(),St.groups));
}
function runPhase(k,ph){
  PTAG=k;
  const C=CONTS[k], A=S.C[C.A], B=S.C[C.B], q=Q[k];
  switch(ph){
  case "p1": A.p1=playPairs(pend(()=>pairSeed(q.p1)),C.A); put(C.A,CAP1(T("rP1")),A.p1); break;
  case "p2": A.p2=playPairs(pend(()=>pairSeed(q.p2.concat(A.p1.map(t=>t.winner)))),C.A);
    put(C.A,T("rP2G"),A.p2); break;
  case "p3": A.p3=playPairs(pend(()=>pairSeed(A.p2.map(t=>t.winner))),C.A);
    A.drop=A.p3.map(t=>t.loser); put(C.A,CAP1(T("rP3")),A.p3,useB()?T("dropNote"):""); break;
  case "sp1": B.p1=playPairs(pend(()=>sudPairsC(k)),C.B); put(C.B,CAP1(T("rP1")),B.p1,T("natNote")); break;
  case "lg": groupsPhase(C.A,q.direct.concat((MODE==="old"?A.p1:A.p3).map(t=>t.winner))); break;
  case "sg": groupsPhase(C.B,sudFieldC(k)); break;
  case "spo": { const pr=pend(()=>{const t=shuffle(A.third); return t.map((x,i)=>[x,B.second[i]])});
    B.po=playPairs(pr,C.B); B.sec=B.po.map(x=>x.winner);
    put(C.B,CAP1(T("rPO")),B.po); break; }
  case "r32A": A.r32=playPairs(pend(()=>pairNat(q.direct)),C.A); put(C.A,T("rR32"),A.r32,T("oldNote")); break;
  case "r32B": B.r32=playPairs(pend(()=>pairNat(MODE==="old"&&k==="am"?sudFieldC(k):Object.values(q.sq).flat())),C.B); put(C.B,T("rR32"),B.r32,T("oldNote")); break;
  default: {
    const key=ph.slice(0,-1), comp=C[ph.slice(-1)], St=S.C[comp];
    if(key==="fin"){ finalOne(comp,St); break }
    const prev={qf:"r16",sf:"qf"}[key];
    St[key]=playPairs(pend(()=>koPairs(St,key,prev)),comp);
    put(comp,T(KEYS2[key]),St[key]); }
  }
}
/* ---------- intercontinental ---------- */
function interMatch(kind){
  const pair=kind==="mun"?[S.C.lib.champ,S.C.ucl.champ]:[S.C.sud.champ,S.C.uel.champ];
  const lbl=T(kind==="mun"?"cMun":"cRec"), note=T(kind==="mun"?"munNote":"recNote");
  if(!pair[0]||!pair[1]) return;
  const res=MODE==="old"?tie(pair[0],pair[1],"mun"):oneOff(pair[0],pair[1],"mun");
  S.C.mun[kind]=res;
  add("mun",lbl,tiesBlock(lbl,[res],note)); S.view="mun";
  log.push(lbl.toUpperCase()+"\n"+(res.one
    ? `${res.a.name} ${res.leg[0]}-${res.leg[1]} ${res.b.name}`+(res.pens?" ("+T("pens")+")":"")
    : line(res)));
}
/* ---------- sequence ---------- */
function ACTS(){
  const ks=ACT(), out=[{sp:"draw"}];
  if(PARALLEL) for(const ph of PHASES()){ const kk=ks.filter(k=>PHK(k,ph));
    if(kk.length) out.push({ph,ks:kk}) }
  else for(const k of ks) for(const ph of PHASES()) if(PHK(k,ph)) out.push({ph,ks:[k]});
  if(ks.length===2){ if(useB()) out.push({sp:"rec"}); out.push({sp:"mun"}) }
  return out;
}
function actLbl(a){
  if(a.sp==="draw") return [T("rDraw"),T("bDraw")];
  if(a.sp) { const l=T(a.sp==="mun"?"cMun":"cRec"); return [l,T("bPlay")+" — "+l] }
  const r=T(PHR[a.ph]), side=PHSIDE(a.ph);
  const cs=a.ks.map(k=>CN(CONTS[k][side])).join(" + ");
  return [CAP1(r)+" — "+cs, T("bPlay")+" "+r+" — "+cs];
}
const R=()=>ACTS().map(a=>actLbl(a)[0]);
const BTN=()=>ACTS().map(a=>actLbl(a)[1]);
/* In parallel order a step plays both continents, so the preview has to be
   computed for each of them and each competition shows its own draw. */
function previewFor(i){
  const a=ACTS()[i]; if(!a) return null;
  if(a.sp==="draw") return null;
  if(a.sp){ const p=a.sp==="mun"?[S.C.lib.champ,S.C.ucl.champ]:[S.C.sud.champ,S.C.uel.champ];
    return (p[0]&&p[1])?[{comp:"mun",pairs:[p],groups:null}]:null }
  return a.ks.map(k=>previewOne(a,k)).filter(Boolean);
}
function previewOne(a,k){
  PTAG=k;
  const C=CONTS[k], A=S.C[C.A], B=S.C[C.B], q=Q[k];
  const comp=C[PHSIDE(a.ph)];
  let pairs=null, groups=null;
  switch(a.ph){
  case "p1": pairs=pend(()=>pairSeed(q.p1)); break;
  case "p2": pairs=pend(()=>pairSeed(q.p2.concat(A.p1.map(t=>t.winner)))); break;
  case "p3": pairs=pend(()=>pairSeed(A.p2.map(t=>t.winner))); break;
  case "sp1": pairs=pend(()=>sudPairsC(k)); break;
  case "lg": groups=pend(()=>makeGroups(q.direct.concat((MODE==="old"?A.p1:A.p3).map(t=>t.winner)),8)); break;
  case "sg": groups=pend(()=>makeGroups(sudFieldC(k),8)); break;
  case "spo": pairs=pend(()=>{const t=shuffle(A.third); return t.map((x,j)=>[x,B.second[j]])}); break;
  case "r32A": pairs=pend(()=>pairNat(q.direct)); break;
  case "r32B": pairs=pend(()=>pairNat(MODE==="old"&&k==="am"?sudFieldC(k):Object.values(q.sq).flat())); break;
  default: { const key=a.ph.slice(0,-1), St=S.C[comp];
    if(key==="fin") pairs=pend(()=>[[St.sf[0].winner,St.sf[1].winner]]);
    else pairs=pend(()=>koPairs(St,key,{qf:"r16",sf:"qf"}[key])); }
  }
  return {comp,pairs,groups};
}
function advance(){
  const acts=ACTS(); if(step>=acts.length) return;
  const a=acts[step];
  if(S.slow&&step>0&&!S.pvOn){
    const ps=previewFor(step);
    if(ps&&ps.length){ S.pvOn=true; S.pv={};
      for(const p of ps) S.pv[p.comp]=pvHTML(p);
      S.view=ps[0].comp; render(); return }
  }
  S.pvOn=false; S.pv=null;
  /* Draw every continent's pairings before any of them is played, so the RNG is
     consumed in the same order whether or not the preview was shown. */
  if(!a.sp) previewFor(step);
  if(a.sp==="draw"){ buildClubs();
    for(const k of ACT()) MODE==="old"?QUALOLD[k](k):QUAL[k](); }
  else if(a.sp) interMatch(a.sp);
  else for(const k of a.ks) runPhase(k,a.ph);
  step++; render();
}

  MODE=el("mode").value; FOREIGN=el("fgn").checked; S.slow=el("slow").checked;
  rnd=mulberry32(parseInt(el("seed").value||1,10)||1);

function pvHTML(p){
  if(p.groups){ const L="ABCDEFGH";
    return `<div class="block"><h3>${T("pvTitle")}</h3><div class="groups">${p.groups.map((g,i)=>
      `<div><h4>${T("group")} ${L[i]}</h4><table>${g.map(c=>
        `<tr><td class="club">${fl(c.co)}${clubLink(c)}</td></tr>`).join("")}</table></div>`).join("")}</div></div>`; }
  return `<div class="block"><h3>${T("pvTitle")}</h3>${p.pairs.map(x=>
    `<div class="tie"><div class="agg"><span class="h">${nmR(x[0])}</span>
      <span class="sc">×</span><span>${nmL(x[1])}</span></div></div>`).join("")}</div>`;
}
function finalOne(comp,St){
  const fp=pend(()=>[[St.sf[0].winner,St.sf[1].winner]])[0];
  const f=oneOff(fp[0],fp[1],comp);
  rec(comp,T("rFinal"),[f]);
  const tal=TALLY[comp], cl=CLEAN[comp];
  const dom=byCo(f.winner.co).findIndex(c=>c.key===f.winner.key)+1;
  const gp=(St.gpos||{})[f.winner.key];
  const gline=gp?`<div class="r"><b>${T("rGroupsShort")}</b><span>${T("group")} ${gp.g}</span>
    <span class="sc">${gp.p}º · ${gp.pts} ${T("pts")}</span></div>`:"";
  const rest=(St.hist||[]).map(h=>{
    const t=h.ties.find(x=>x.a.key===f.winner.key||x.b.key===f.winner.key);
    if(!t) return "";
    const home=t.a.key===f.winner.key, opp=home?t.b:t.a;
    const sc=t.one?(home?t.leg[0]+"–"+t.leg[1]:t.leg[1]+"–"+t.leg[0])
                  :(home?t.agg[0]+"–"+t.agg[1]:t.agg[1]+"–"+t.agg[0]);
    const mine=t.one?(home?t.sc[0]:t.sc[1])
      :(home?t.sc[0][0].concat(t.sc[1][1]):t.sc[0][1].concat(t.sc[1][0]));
    const tal={}; mine.forEach(g=>{tal[g.name]=(tal[g.name]||0)+1});
    const gl=Object.entries(tal).map(([n,c])=>esc(shortName(n))+(c>1?" ("+c+")":"")).join(", ");
    return `<div class="r"><b>${h.label}</b><span>${fl(opp.co)}${esc(opp.name)}</span>
      <span class="sc">${sc}${t.pens?" p":""}</span></div>`
      +(gl?`<div class="rg">${gl}</div>`:"");
  }).filter(Boolean).join("");
  const path=gline+rest;
  const extra=`<div class="block"><h3>${T("path")}</h3><div class="pathbox">${path}</div>
    <p class="dompos">${ORD(dom)}${T("domestic")} — ${CO(f.winner.co)}</p></div>`;
  add(comp,T("rFinal"),tiesBlock(T("rFinal"),[f])+champBlock(f.winner.name)+extra
    +xiBlock(T("champXI"),f.winner.squad.map(p=>({...p,cs:(cl[f.winner.key]||{}).cs||0,
      g:(tal[p.id]||{}).goals||0})),
      esc(f.winner.name)+" · "+CO(f.winner.co),T("champXI"),f.winner.key));
  const qf=St.qf.flatMap(t=>[t.a,t.b]);
  const runs={}; St.sf.flatMap(t=>[t.a,t.b]).forEach(c=>runs[c.key]=2);
  [f.a,f.b].forEach(c=>runs[c.key]=4); runs[f.winner.key]=8;
  add(comp,T("selTab"),award(comp,qf,runs,T(comp==="lib"?"king":"prince"))
    +xiBlock(T("bestXI"),bestXI(comp,qf,"x").squad,T("selNote"),
      T("bestXI")+" — "+CN(comp)));
  St.champ=f.winner;
  S.tab[comp]=S.blocks[comp].length-2; S.view=comp;
  const cname=CN(comp).toUpperCase();
  const xiTxt=sq=>sq.map(p=>p.pos.padEnd(3)+" "+p.n+(p.club?" ("+p.club+")":"")).join("\n");
  const sel=bestXI(comp,qf,"x").squad;
  const kg=(()=>{ const g={}; Object.entries(TALLY[comp]).forEach(([k,r])=>{g[k]=r.goals});
    const BK={GK:1,RB:1,CB:1,LB:1}; let b=null;
    qf.forEach(c=>{ const t=(CLEAN[comp][c.key]||{cs:0}), bo=runs[c.key]||0;
      c.squad.forEach(p=>{ const gg=g[p.id]||0;
        const s=(BK[p.pos]?p.r+2*t.cs:p.r+2*gg)+bo;
        if(!b||s>b.s) b={s,n:p.n,c:c.name} }) });
    return b })();
  log.push(cname+" — "+T("champion").toUpperCase()+": "+f.winner.name+" ("+CO(f.winner.co)+")"
    +"\n\n"+T("champXI").toUpperCase()+"\n"+xiTxt(f.winner.squad)
    +"\n\n"+T(comp==="lib"?"king":"prince").toUpperCase()+": "+kg.n+" ("+kg.c+")"
    +"\n\n"+T("bestXI").toUpperCase()+"\n"+xiTxt(sel));
}

    const cos=(S.cont==="am"?AMER:EURO).slice().sort((a,b)=>ptbr(CO(a),CO(b)));
    S.co=cos[0]; S.club=null; render(); return }
  const b=e.target.closest("button[data-co]"); if(b){S.co=b.dataset.co; S.club=null; render()}});
["p-lib","p-sud","p-ucl","p-uel","p-mun"].forEach(p=>el(p).onclick=e=>{
  const n=e.target.closest("[data-club]"); if(!n) return;
  const k=n.dataset.club; if(!S.ALL[k]) return;
  S.view="sq"; S.co=k.split("|")[0]; S.cont=contOf(S.co); S.club=k; render();
});
el("clublist").onclick=e=>{const li=e.target.closest("li[data-k]"); if(li){S.club=li.dataset.k; render()}};
COMPS.forEach(c=>el("s-"+c).onclick=e=>{
  const b=e.target.closest("button[data-i]"); if(!b) return;
  S.tab[c]=b.dataset.i==="art"?"art":+b.dataset.i; render()});
el("link").onclick=()=>{
  const q=new URLSearchParams({seed:el("seed").value,mode:MODE,lang:LANG,
    comps:COMPSET,order:PARALLEL?"par":"ser",era:ERA});
  if(S.slow) q.set("slow","1");
  if(!FOREIGN) q.set("fgn","0");
  const url=location.origin+location.pathname+"?"+q;
  navigator.clipboard?.writeText(url);
  el("link").textContent=T("copied"); setTimeout(()=>el("link").textContent=T("copyLink"),1400);
};
el("dump").onclick=()=>{
  const top=c=>Object.values(TALLY[c]).sort((a,b)=>b.goals-a.goals).slice(0,10)
    .map(r=>`${r.goals}  ${r.n} (${r.club})`).join("\n");
  navigator.clipboard?.writeText(
    T("title")+" · "+T("seed")+" "+el("seed").value+" · "+(MODE==="modern"?T("fmodern"):T("fold"))
    +"\n\n"+log.join("\n\n")
    +ACOMPS().filter(c=>Object.keys(TALLY[c]).length)
      .map(c=>"\n\n"+T("scorersOf")+" — "+CN(c).toUpperCase()+"\n"+top(c)).join(""));
  el("dump").textContent=T("copied"); setTimeout(()=>el("dump").textContent=T("copy"),1400);
};
(function(){
  const q=new URLSearchParams(location.search);
  const sd=parseInt(q.get("seed"),10);
  el("seed").value=String(sd>0?sd:1+Math.floor(Math.random()*999999));
  if(q.get("mode")==="old") el("mode").value="old";
  const lg=q.get("lang"); if(lg==="es"||lg==="en"){ LANG=lg; el("lang").value=lg }
  if(q.get("slow")==="1") el("slow").checked=true;
  const cs=q.get("comps"); if(["all","am","eu","top"].indexOf(cs)>=0) el("comps").value=cs;
  if(q.get("order")==="ser") el("order").value="ser";
  if(q.get("era")==="17") el("era").value="17";
  if(q.get("fgn")==="0") el("fgn").checked=false;
})();
chrome();
reset();
</script>
</body>
</html>
